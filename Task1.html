<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Responsive Image Gallery</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#f4f4f4;
      padding:20px;
    }

    h1{
      text-align:center;
      margin-bottom:20px;
      color:#333;
    }

    /* Filter Buttons */
    .filters{
      text-align:center;
      margin-bottom:25px;
    }

    .filters button{
      padding:10px 18px;
      margin:5px;
      border:none;
      background:#333;
      color:white;
      border-radius:5px;
      cursor:pointer;
      transition:0.3s;
    }

    .filters button:hover{
      background:#ff9800;
      transform:scale(1.05);
    }

    /* Gallery Layout */
    .gallery{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(250px,1fr));
      gap:20px;
    }

    .gallery-item{
      position:relative;
      overflow:hidden;
      border-radius:10px;
      cursor:pointer;
    }

    .gallery-item img{
      width:100%;
      height:250px;
      object-fit:cover;
      transition:transform 0.5s ease;
      border-radius:10px;
    }

    /* Hover Effect */
    .gallery-item:hover img{
      transform:scale(1.1);
    }

    .overlay{
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.5);
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      opacity:0;
      transition:0.4s;
      font-size:22px;
      border-radius:10px;
    }

    .gallery-item:hover .overlay{
      opacity:1;
    }

    /* Lightbox */
    .lightbox{
      display:none;
      position:fixed;
      z-index:1000;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.9);
      justify-content:center;
      align-items:center;
      flex-direction:column;
    }

    .lightbox img{
      width:80%;
      max-width:700px;
      border-radius:10px;
      animation:zoom 0.4s ease;
    }

    @keyframes zoom{
      from{
        transform:scale(0.5);
      }
      to{
        transform:scale(1);
      }
    }

    .close{
      position:absolute;
      top:20px;
      right:35px;
      font-size:40px;
      color:white;
      cursor:pointer;
    }

    .nav-btn{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      background:rgba(255,255,255,0.3);
      color:white;
      border:none;
      padding:15px;
      cursor:pointer;
      font-size:24px;
      border-radius:50%;
      transition:0.3s;
    }

    .nav-btn:hover{
      background:#ff9800;
    }

    .prev{
      left:30px;
    }

    .next{
      right:30px;
    }

    /* Responsive */
    @media(max-width:768px){
      .lightbox img{
        width:95%;
      }

      .nav-btn{
        padding:10px;
        font-size:18px;
      }
    }
  </style>
</head>
<body>

  <h1>Responsive Image Gallery</h1>

  <!-- Filter Buttons -->
  <div class="filters">
    <button onclick="filterImages('all')">All</button>
    <button onclick="filterImages('nature')">Nature</button>
    <button onclick="filterImages('city')">City</button>
    <button onclick="filterImages('animals')">Animals</button>
  </div>

  <!-- Gallery -->
  <div class="gallery">

    <div class="gallery-item nature">
      <img src="https://picsum.photos/id/1015/600/400" alt="Nature">
      <div class="overlay">Nature</div>
    </div>

    <div class="gallery-item city">
      <img src="https://picsum.photos/id/1011/600/400" alt="City">
      <div class="overlay">City</div>
    </div>

    <div class="gallery-item animals">
      <img src="https://picsum.photos/id/1025/600/400" alt="Animal">
      <div class="overlay">Animal</div>
    </div>

    <div class="gallery-item nature">
      <img src="https://picsum.photos/id/1039/600/400" alt="Nature">
      <div class="overlay">Nature</div>
    </div>

    <div class="gallery-item city">
      <img src="https://picsum.photos/id/1043/600/400" alt="City">
      <div class="overlay">City</div>
    </div>

    <div class="gallery-item animals">
      <img src="https://picsum.photos/id/1062/600/400" alt="Animal">
      <div class="overlay">Animal</div>
    </div>

  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <span class="close">&times;</span>

    <button class="nav-btn prev">&#10094;</button>

    <img id="lightbox-img" src="" alt="">

    <button class="nav-btn next">&#10095;</button>
  </div>

  <script>
    const galleryImages = document.querySelectorAll(".gallery-item img");
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    const closeBtn = document.querySelector(".close");
    const nextBtn = document.querySelector(".next");
    const prevBtn = document.querySelector(".prev");

    let currentIndex = 0;

    // Open Lightbox
    galleryImages.forEach((img, index) => {
      img.addEventListener("click", () => {
        currentIndex = index;
        showImage();
        lightbox.style.display = "flex";
      });
    });

    // Show Image
    function showImage() {
      lightboxImg.src = galleryImages[currentIndex].src;
    }

    // Next Image
    nextBtn.addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % galleryImages.length;
      showImage();
    });

    // Previous Image
    prevBtn.addEventListener("click", () => {
      currentIndex =
        (currentIndex - 1 + galleryImages.length) %
        galleryImages.length;
      showImage();
    });

    // Close Lightbox
    closeBtn.addEventListener("click", () => {
      lightbox.style.display = "none";
    });

    // Close when clicking outside image
    lightbox.addEventListener("click", (e) => {
      if (e.target !== lightboxImg &&
          e.target !== nextBtn &&
          e.target !== prevBtn) {
        lightbox.style.display = "none";
      }
    });

    // Filter Images
    function filterImages(category) {
      const items = document.querySelectorAll(".gallery-item");

      items.forEach(item => {
        if (category === "all") {
          item.style.display = "block";
        } else {
          if (item.classList.contains(category)) {
            item.style.display = "block";
          } else {
            item.style.display = "none";
          }
        }
      });
    }
  </script>

</body>
</html>
